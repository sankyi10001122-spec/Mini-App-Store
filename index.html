<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini App Store</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <h1>Mini App Store</h1>
        </header>

        <hr class="divider">

        <!-- Search Bar -->
        <div class="search-container">
            <input type="text" placeholder="App နာမည် ရှာကြည့်ပါ..." id="searchInput">
        </div>

        <!-- App Card Section -->
        <div class="app-card">
            
            <!-- အပေါ်ပိုင်း: Logo နှင့် App Name (ဘေးတိုက်) -->
            <div class="app-header-row">
                <div class="app-logo">
                    <img src="icon.png" alt="App Logo" onerror="this.src='https://via.placeholder.com/70/0a192f/00ff88?text=Logo'">
                </div>
                <div class="app-title">
                    <h2>Data Checker V3</h2>
                    <div class="app-meta">
                        <span class="version">v3.0</span>
                        <span class="dot">•</span>
                        <span class="size">262.96K</span>
                    </div>
                </div>
            </div>
            
            <!-- အလယ်ပိုင်း: ဖော်ပြချက် -->
            <div class="app-body">
                <p class="app-desc">Starlinkမှ Network Data လက်ကျန်များကို အချိန်နှင့် တပြေးညီ စစ်ဆေးရန်</p>
            </div>
            
            <!-- အောက်ပိုင်း: Download Button -->
            <div class="app-footer">
                <a href="https://www.mediafire.com/file/aumh46qwus1wuwz/Data_Checker_1.6.apk/file" target="_blank" class="download-btn">Download APK</a>
            </div>
            
        </div>

        <hr class="divider">

        <!-- Interface Preview Section -->
        <div class="preview-section">
            <h3>📱 APP INTERFACE PREVIEW</h3>
            
            <div class="screenshot-container">
                <img src="screenshot.png" alt="App Screenshot" onerror="this.src='https://via.placeholder.com/300x500/0a192f/00ff88?text=Screenshot'">
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
