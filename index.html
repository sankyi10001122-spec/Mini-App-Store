<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini App Store</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Top Bar (Play Store လို အပေါ်ခေါင်းစဉ်) -->
    <div class="top-bar">
        <h1>Mini App Store</h1>
    </div>

    <div class="container">
        <!-- App Main Info (Play Store Detail Page ပုံစံ) -->
        <div class="app-detail">
            
            <!-- Logo နဲ့ App Name -->
            <div class="app-header">
                <img src="icon.png" alt="App Logo" class="app-logo" onerror="this.src='https://via.placeholder.com/90/0a192f/00ff88?text=Logo'">
                <div class="app-title">
                    <h2>Data Checker V3</h2>
                    <p class="developer">Starlink Network Data</p>
                </div>
            </div>

            <!-- Data (Rating, Size, Version) -->
            <div class="stats-row">
                <div class="stat-box">
                    <span class="stat-value">4.8 ★</span>
                    <span class="stat-label">Rating</span>
                </div>
                <div class="divider"></div>
                <div class="stat-box">
                    <span class="stat-value">262K</span>
                    <span class="stat-label">Size</span>
                </div>
                <div class="divider"></div>
                <div class="stat-box">
                    <span class="stat-value">v3.0</span>
                    <span class="stat-label">Version</span>
                </div>
            </div>

            <!-- Download Button -->
            <a href="https://www.mediafire.com/file/aumh46qwus1wuwz/Data_Checker_1.6.apk/file" target="_blank" class="btn-download">Download APK</a>

            <!-- About Section -->
            <div class="about-section">
                <h3>About this app</h3>
                <p>Starlinkမှ Network Data လက်ကျန်များကို အချိန်နှင့် တပြေးညီ စစ်ဆေးရန်။ အသုံးပြုသူများအတွက် အဆင်ပြေလွယ်ကူစွာ အသုံးပြုနိုင်မည့် App ဖြစ်ပါသည်။</p>
            </div>
        </div>

        <!-- Screenshots (Play Store လို ဘေးတိုက်ပွတ်ကြည့်ရန်) -->
        <div class="screenshot-section">
            <h3>App Screenshots</h3>
            <div class="screenshot-scroll">
                <img src="screenshot.png" alt="Screenshot" onerror="this.src='https://via.placeholder.com/250x500/0a192f/00ff88?text=Screenshot'">
            </div>
        </div>
    </div>

</body>
</html>
