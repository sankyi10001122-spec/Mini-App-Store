<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini App Store</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <!-- Header Section -->
        <header>
            <h1>Mini App Store</h1>
        </header>

        <hr class="divider">

        <!-- Search Bar -->
        <div class="search-container">
            <input type="text" placeholder="App နာမည် ရှာကြည့်ပါ..." id="searchInput">
        </div>

        <!-- App Card Section -->
        <div class="app-card">
            <!-- Logo -->
            <div class="app-logo">
                <img src="https://i.ibb.co/6P0Z9QK/shield-logo.jpg" alt="Data Checker Logo" onerror="this.src='https://via.placeholder.com/70/0a192f/00ff88?text=Logo'">
            </div>
            
            <!-- App Info -->
            <div class="app-info">
                <h2>Data Checker V3</h2>
                <div class="app-meta">
                    <span class="version">v3.0</span>
                    <span class="dot">•</span>
                    <span class="size">262.96K</span>
                </div>
                <p class="app-desc">Starlinkမှ Network Data လက်ကျန်များကို အချိန်နှင့် တပြေးညီ စစ်ဆေးရန်</p>
            </div>

            <!-- Download Button -->
            <div class="download-btn-container">
                <!-- ဒီနေရာမှာ သင့် Mediafire Link ကို ထည့်ထားပါတယ် -->
                <a href="https://www.mediafire.com/file/aumh46qwus1wuwz/Data_Checker_1.6.apk/file" target="_blank" class="download-btn">Download</a>
            </div>
        </div>

        <hr class="divider">

        <!-- Interface Preview Section -->
        <div class="preview-section">
            <h3>📱 APP INTERFACE PREVIEW</h3>
            
            <!-- Mimic App UI -->
            <div class="app-ui-preview">
                <div class="ui-header">
                    <h4>Data Checker V3 <span class="v3-badge">V3</span></h4>
                    <span class="battery">94% 🔋</span>
                </div>
                
                <div class="status-online">
                    <span class="dot-online"></span> SYSTEM ONLINE
                </div>

                <div class="auth-box">
                    <p>AUTHENTICATED USER</p>
                    <h2>va23uhx</h2>
                </div>

                <div class="data-grid">
                    <div class="data-box">
                        <h2 class="green-text">3.102 MB</h2>
                        <p>USED DATA</p>
                    </div>
                    <div class="data-box">
                        <h2 class="blue-text">861.648 MB</h2>
                        <p>REMAINING</p>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
