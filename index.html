<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini App Store</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <!-- Header -->
        <header>
            <h1>Mini App Store</h1>
        </header>

        <!-- Search Bar -->
        <div class="search-container">
            <input type="text" placeholder="App နာမည် ရှာကြည့်ပါ..." id="searchInput">
        </div>

        <!-- App Details Section (Play Store Style) -->
        <div class="play-store-card">
            
            <!-- အပေါ်ဆုံးတန်း: Logo နဲ့ App Name -->
            <div class="app-header-row">
                <div class="app-logo">
                    <img src="icon.png" alt="App Logo" onerror="this.src='https://via.placeholder.com/90/0a192f/00ff88?text=Logo'">
                </div>
                <div class="app-title">
                    <h2>Data Checker V3</h2>
                    <p class="developer-name">Starlink Network Data</p>
                </div>
            </div>

            <!-- အလယ်တန်း: Data Info (Play Store က Rating/Size လိုမျိုး) -->
            <div class="app-stats-row">
                <div class="stat-item">
                    <span class="stat-value">4.8 ★</span>
                    <span class="stat-label">Rating</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                    <span class="stat-value">262.96K</span>
                    <span class="stat-label">Size</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                    <span class="stat-value">v3.0</span>
                    <span class="stat-label">Version</span>
                </div>
            </div>

            <!-- Download Button (Play Store ရဲ့ Install ခလုတ်လို) -->
            <a href="https://www.mediafire.com/file/aumh46qwus1wuwz/Data_Checker_1.6.apk/file" target="_blank" class="download-btn">Download APK</a>

            <!-- App ဖော်ပြချက် -->
            <div class="about-section">
                <h3>About this app</h3>
                <p>Starlinkမှ Network Data လက်ကျန်များကို အချိန်နှင့် တပြေးညီ စစ်ဆေးရန်။ အသုံးပြုသူများအတွက် အဆင်ပြေလွယ်ကူစွာ အသုံးပြုနိုင်မည့် App ဖြစ်ပါသည်။</p>
            </div>

        </div>

        <!-- Interface Preview Section -->
        <div class="preview-section">
            <h3>App Screenshot</h3>
            <!-- Screenshot ကို ဘေးတိုက် ပွတ်ကြည့်လို့ရအောင် (Scroll) လုပ်ထားပါတယ် -->
            <div class="screenshot-scroll">
                <img src="screenshot.png" alt="App Screenshot 1" onerror="this.src='https://via.placeholder.com/250x500/0a192f/00ff88?text=Screenshot'">
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
